# Render Blueprint. In Render: New + -> Blueprint -> connect this repo.
services:
  - type: web
    name: trainmate
    runtime: docker
    plan: starter          # small paid instance; use "free" to try (sleeps when idle)
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # set this secret in the Render dashboard
      - key: SECRET_KEY
        generateValue: true  # Render generates a strong random value
      - key: TRAINMATE_USERS
        sync: false          # set as: alice:pass1,bob:pass2,carol:pass3
      - key: MODEL
        value: claude-sonnet-5
      - key: COOKIE_SECURE
        value: "1"
